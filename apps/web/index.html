<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planning Poker</title>
    <meta
      name="description"
      content="Planning poker em tempo real para times ágeis. Sem cadastro, com votos protegidos até a revelação."
    />
    <meta name="theme-color" content="#7c3aed" />
    <!-- SVG para quem suporta (nítido em qualquer tamanho e acompanha o tema do
         sistema); .ico com 16/32/48 para o resto e para o atalho no Windows. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Cartão de compartilhamento. A URL da imagem precisa ser absoluta: quem
         lê estas tags é um robô do Slack, do WhatsApp ou do LinkedIn, que não
         tem base para resolver caminho relativo. Trocar de domínio pede trocar
         aqui. A imagem é gerada de `og-source.svg`, no diretório do app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Planning Poker" />
    <meta property="og:title" content="Planning Poker — estimativa de sprint em tempo real" />
    <meta
      property="og:description"
      content="Estime a sprint com o time inteiro na mesma mesa. Sem cadastro, sem planilha, e ninguém enxerga a carta de ninguém antes da hora."
    />
    <meta property="og:url" content="https://planning-poker-sable-one.vercel.app/" />
    <meta property="og:image" content="https://planning-poker-sable-one.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cinco cartas de planning poker em leque, com os números 3, 5, 8, 13 e 21" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Planning Poker — estimativa de sprint em tempo real" />
    <meta
      name="twitter:description"
      content="Sem cadastro, sem planilha, e ninguém enxerga a carta de ninguém antes da hora."
    />
    <meta name="twitter:image" content="https://planning-poker-sable-one.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
